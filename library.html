<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EchoLab · 素材库</title>
<style>
:root{--bg:#0f131a;--panel:#161b24;--panel2:#1c222d;--line:#2a323f;--fg:#e8edf5;
 --dim:#94a3b8;--dim2:#64748b;--accent:#5b9dff;--accent-soft:#5b9dff22;--active:#ffd76a;--r:14px}
@media(prefers-color-scheme:light){:root{--bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f6;
 --line:#e2e6ee;--fg:#1a2130;--dim:#5b6779;--dim2:#8a94a6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
 -webkit-font-smoothing:antialiased;
 padding:max(18px,env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:20px;margin:0;letter-spacing:.3px}
h1 span{color:var(--accent)}
.sub{color:var(--dim);font-size:13.5px;margin:0 0 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:10px;
 padding:10px 13px;min-width:190px;flex:1;max-width:320px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;
 padding:7px 13px;font-size:13px;cursor:pointer;color:var(--dim);white-space:nowrap}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:11px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
 overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column;
 text-decoration:none;color:inherit}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.thumb{aspect-ratio:16/9;background:var(--panel2);position:relative;overflow:hidden;
 display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ph{font-size:30px;opacity:.45}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.78);color:#fff;
 font-size:11px;padding:2px 6px;border-radius:5px;font-variant-numeric:tabular-nums}
.src{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.68);color:#fff;
 font-size:10.5px;padding:2px 7px;border-radius:5px}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.16)}
.prog i{display:block;height:100%;background:var(--active)}
.body{padding:11px 12px 13px;display:flex;flex-direction:column;gap:7px;flex:1}
.t{font-size:14.5px;font-weight:600;line-height:1.4;display:-webkit-box;
 -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--dim2);margin-top:auto}
.stars{color:var(--active);letter-spacing:.5px;font-size:11px}
.tag{background:var(--panel2);border:1px solid var(--line);padding:1px 7px;border-radius:999px}
.empty{text-align:center;color:var(--dim2);padding:64px 20px;line-height:2}
code{background:var(--panel2);padding:2px 7px;border-radius:5px;font-size:13px}
.count{color:var(--dim2);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>EchoLab<span>·</span>素材库</h1>
    <span class="count" id="count"></span>
  </header>
  <p class="sub">点任意一期开始学。进度会自动记住。</p>
  <div class="bar">
    <input type="search" id="q" placeholder="搜标题、主题…">
    <button class="chip on" data-f="all">全部</button>
    <button class="chip" data-f="unfinished">未学完</button>
    <button class="chip" data-f="easy">★1-2 简单</button>
    <button class="chip" data-f="hard">★4-5 有挑战</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const store={get(k,d){try{const x=localStorage.getItem(k);return x===null?d:JSON.parse(x)}catch(e){return d}}};
const PROG=store.get("echolab.progress",{});
let EPS=[],filter="all",kw="";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,"0")}`;

function thumbOf(e){
  const m=/^youtube:([A-Za-z0-9_-]{11})$/.exec(e.media||"");
  if(m) return `https://i.ytimg.com/vi/${m[1]}/hqdefault.jpg`;   // 直接用原视频封面
  if(e.poster) return `library/${e.id}/${e.poster}`;
  return "";
}
const srcOf=e=>/^youtube:/.test(e.media||"")?"YouTube"
  :(/\.(wav|mp3|m4a|aac|ogg|flac)$/i.test(e.media||"")?"音频":"");

function pct(e){
  const p=PROG[e.id];
  if(!p||!e.n_segments) return 0;
  return Math.min(100,Math.round((p.seg+1)/e.n_segments*100));
}
function card(e){
  const th=thumbOf(e),p=pct(e),src=srcOf(e);
  return `<a class="card" href="player.html?ep=${encodeURIComponent(e.id)}">
    <div class="thumb">
      ${th?`<img src="${esc(th)}" loading="lazy" alt=""
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'🎧'}))">`
          :`<div class="ph">🎧</div>`}
      ${src?`<span class="src">${src}</span>`:""}
      <span class="dur">${fmt(e.duration||0)}</span>
      ${p?`<span class="prog"><i style="width:${p}%"></i></span>`:""}
    </div>
    <div class="body">
      <div class="t">${esc(e.title||e.id)}</div>
      <div class="mrow">
        <span class="stars">${"★".repeat(e.difficulty||0)}${"☆".repeat(5-(e.difficulty||0))}</span>
        ${(e.topics||[]).slice(0,2).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}
        <span>${e.n_cards||0} 词卡</span>
        ${p?`<span style="color:var(--active)">${p===100?"已学完":p+"%"}</span>`:""}
      </div>
    </div></a>`;
}
function render(){
  let list=EPS.filter(e=>{
    if(kw){const s=((e.title||"")+" "+(e.topics||[]).join(" ")+" "+(e.summary||"")).toLowerCase();
      if(!s.includes(kw)) return false;}
    if(filter==="unfinished") return pct(e)<100;
    if(filter==="easy") return (e.difficulty||0)<=2;
    if(filter==="hard") return (e.difficulty||0)>=4;
    return true;
  });
  $("#count").textContent=`${list.length} / ${EPS.length} 期`;
  $("#grid").innerHTML=list.length?list.map(card).join("")
    :`<div class="empty" style="grid-column:1/-1">没有匹配的内容。</div>`;
}
(async()=>{
  let idx;
  try{ idx=await (await fetch("library/index.json?"+Date.now())).json(); }
  catch(e){
    $("#grid").innerHTML=`<div class="empty" style="grid-column:1/-1">
      读不到素材库。请用 <code>python serve.py</code> 启动,不要直接双击打开本文件。</div>`;
    return;
  }
  EPS=(idx.episodes||[]).slice().reverse();
  if(!EPS.length){
    $("#grid").innerHTML=`<div class="empty" style="grid-column:1/-1">
      素材库还是空的。<br>先跑 <code>python demo.py</code> 看演示,<br>
      或用 <code>python process.py --url &lt;网址&gt;</code> 添加内容。</div>`;
    return;
  }
  render();
})();
$("#q").oninput=e=>{kw=e.target.value.trim().toLowerCase();render()};
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
  document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c));
  filter=c.dataset.f; render();
});
</script>
</body>
</html>
