# EchoLab 的 lint 配置。
#
# 原则:**只抓真 bug,不管风格。**
# 这个项目的代码风格是刻意的(`import os, sys` 合并成一行、`if cond: a; b` 写成一行、
# 中文注释顶格、sys.path.insert 写在 import 之前),这些都不是错误,
# 不该为了让 lint 变绿去改一堆能正常跑的代码。
# 所以下面不用 ruff 的默认规则集,而是手挑了几条「命中即真问题」的。

target-version = "py310"

# 素材数据和本地产物不参与 lint
extend-exclude = [
    "library",
    "downloads",
    "docs",
    "wordlists",
    ".cache",
    ".queue",
]

# 这个项目习惯写长行(尤其是中文注释和提示词),不因为长度报错。
# 留一个极宽的上限,纯粹是防手滑贴进来一整段。
line-length = 200

[lint]
# 显式覆盖 ruff 默认的 ["E4", "E7", "E9", "F"],只留下面这些。
select = [
    "E9",    # 语法/解析层面的致命错误
    "F63",   # 比较运算符用错(is 比字面量、== 比 tuple 之类)
    "F7",    # 语句放错位置(循环外 break、函数外 return、except 顺序写反)
    "F82",   # 用了不存在的名字 —— 最值钱的一条,拼错的变量/函数当场现形
    "F811",  # 同名定义被重复覆盖(合并冲突残留的典型症状)
    "F502",  # % 格式化传了 dict 却用了 *
    "F506",  # % 格式化混用位置和名字
    "F522",  # .format() 传了用不上的关键字
    "F524",  # .format() 少传了参数
    "F631",  # assert 一个 tuple —— 永远为真,等于没断言
    "F632",  # 用 is 比较字符串/数字字面量
    "F702",  # 循环外 continue
    "B002",  # 用了 ++x 这种在 Python 里没意义的写法
]

# 明确不启用的(留个记录,免得以后有人顺手加回来):
#   E1/E2/E3/E7  缩进、空格、一行多语句 —— 全是风格
#   E402         import 不在文件顶部 —— 本项目要先 sys.path.insert,属于必要写法
#   E501         行太长 —— 中文注释和提示词天然长
#   F401         import 了没用 —— 存在误报(延迟导入、重导出),噪音大于价值
#   W291/W293    行尾空格 —— 风格

[lint.per-file-ignores]
# 测试脚本靠模块级的 print/assert 直接跑,写法比较随意
"tests/*" = ["F811"]
